.palette{display:grid;grid-template-columns:repeat(4,26px);gap:6px}.col{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer}
.thick{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:#f1f5f9;border:2px solid transparent;cursor:pointer;width:100%;font-size:11px}.thick.on{border-color:#ff5e1a;background:#fff7ed}.dot{border-radius:50%;background:#0f172a}

<script>
let room=(new URLSearchParams(location.search).get('room')||'mohan-class-1').toLowerCase().replace(/[^a-z0-9-]/g,'-'); let role=new URLSearchParams(location.search).get('role')||'teacher'; let isTeacher=role==='teacher';
document.getElementById('roomLabel').textContent=room+' | '+(isTeacher?'Teacher':'Student');
if(!isTeacher){ document.getElementById('clsTx').textContent='Join Class'; document.getElementById('permPanel').style.display='none'; }
let pdfCanvas=document.getElementById('pdfCanvas'), pdfCtx=pdfCanvas.getContext('2d'), board=document.getElementById('board'), ctx=board.getContext('2d'), boardWrap=document.getElementById('boardWrap');
function log(t){ let e=document.getElementById('log'); let d=document.createElement('div'); d.textContent=new Date().toLocaleTimeString()+': '+t; e.appendChild(d); e.scrollTop=9999; }
let palette=['#000000','#ff0000','#0066ff','#22c55e','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#ffffff','#ff5e1a','#00d2ff','#84cc16'];
let curColor='#000000', curSize=6, curTool='pen', penType='pen';
let slides=[{bg:'white',strokes:[],isPdf:false,pdfImage:null}], curSlide=0, pdfDoc=null, curPdfPage=1, pdfScale=1.2, perms={canWrite:false};
let pal=document.getElementById('pal'); palette.forEach(c=>{ let d=document.createElement('div'); d.className='col'; d.style.background=c; d.onclick=()=>{ curColor=c; document.getElementById('curColorDot').style.background=c; closeAllPops(); }; pal.appendChild(d); });
function closeAllPops(){ document.querySelectorAll('.popup').forEach(p=>p.classList.remove('show')); }
function togglePop(id){ let p=document.getElementById(id); let was=p.classList.contains('show'); closeAllPops(); if(!was) p.classList.add('show'); }
function toggleCollapseDot(){
 let tb=document.getElementById('floatTB'), body=document.getElementById('tbBody'), head=document.getElementById('dragHead');
 if(tb.classList.contains('dotMode')){ // expand
   tb.classList.remove('dotMode'); body.style.display='flex'; head.style.display='flex'; tb.innerHTML=tb.dataset.original||tb.innerHTML;
   // reattach drag after expand - re-init
   location.reload(); // simplest to restore - or we will just show
 } else {
   // collapse to dot
   tb.dataset.wasLeft=tb.style.left; tb.dataset.wasTop=tb.style.top;
   tb.classList.add('dotMode'); body.style.display='none'; head.style.display='none';
   tb.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer" onclick="expandFromDot()">●</div>';
   log('Toolbar collapsed to dot - click dot to expand');
 }
}
function expandFromDot(){
 let tb=document.getElementById('floatTB'); tb.classList.remove('dotMode'); tb.innerHTML=`<div class="tbHead" id="dragHead"><span>⋮⋮</span><span id="collapseBtn" onclick="toggleCollapseDot()" style="cursor:pointer;padding:2px 6px;background:#1e293b;border-radius:4px">●</span></div><div class="tbBody" id="tbBody">
<button class="tB on" data-t="pen" onclick="togglePop('penPop')">✏️</button><div class="popup" id="penPop"><div style="font-size:10px;font-weight:700">PENCIL</div><button class="thick on" onclick="setPenType('pen')">✏️ Pencil</button><button class="thick" onclick="setPenType('highlighter')">🖍️ Highlighter</button><div style="font-size:10px;font-weight:700">THICKNESS</div><button class="thick" onclick="setSize(3)"><div class="dot" style="width:3px;height:3px"></div> 3px</button><button class="thick on" onclick="setSize(6)"><div class="dot" style="width:6px;height:6px"></div> 6px</button><button class="thick" onclick="setSize(10)"><div class="dot" style="width:10px;height:10px"></div> 10px</button><button class="thick" onclick="setSize(16)"><div class="dot" style="width:16px;height:16px"></div> 16px</button></div>
<button class="tB" onclick="setTool('text')">T</button>
<div style="position:relative"><button class="tB" onclick="togglePop('shapePop')">⬜</button><div class="popup" id="shapePop"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><button class="tB" onclick="setShape('rect')">⬜</button><button class="tB" onclick="setShape('circle')">⭕</button><button class="tB" onclick="setShape('line')">📏</button><button class="tB" onclick="setShape('arrow')">➡️</button><button class="tB" onclick="setShape('triangle')">🔺</button><button class="tB" onclick="setShape('axis')">📈</button></div></div></div>
<div style="position:relative"><button class="tB" onclick="togglePop('eraserPop')">🧹</button><div class="popup" id="eraserPop"><button class="thick on" onclick="setEraser('pixel')">🧹 Part</button><button class="thick" onclick="setEraser('stroke')">🗑️ Stroke</button><button class="thick" onclick="clearCurrent(true)">🧼 Clear</button></div></div>
<div style="position:relative"><div class="cDot" id="curColorDot" style="background:${curColor}" onclick="togglePop('colorPop')"></div><div class="popup" id="colorPop"><div class="palette" id="pal2"></div></div></div>
<button class="tB" onclick="document.getElementById('pdfIn').click()">📄</button>
<button class="tB" onclick="openBrowser()" style="background:#0f172a;color:#fff">🌐</button>
<button class="tB" onclick="setTool('hand')">✋</button>
</div>`;
   initDrag(); // re-init drag
   let pal2=document.getElementById('pal2'); if(pal2){ palette.forEach(c=>{ let d=document.createElement('div'); d.className='col'; d.style.background=c; d.onclick=()=>{ curColor=c; document.getElementById('curColorDot').style.background=c; closeAllPops(); }; pal2.appendChild(d); }); }
}
function setPenType(t){ penType=t; setTool('pen'); closeAllPops(); log('Pen: '+t); }
function setEraser(t){ curTool=t==='pixel'?'eraser':'strokeEraser'; setTool(curTool); closeAllPops(); }
function setShape(s){ curTool=s; setTool(s); closeAllPops(); }
function setSize(s){ curSize=s; log('Size '+s); }
function drawBG(bg){ pdfCtx.fillStyle='#fff'; pdfCtx.fillRect(0,0,1000,700); if(bg==='ruled'){ pdfCtx.strokeStyle='#93c5fd'; for(let y=48;y<700;y+=32){ pdfCtx.beginPath(); pdfCtx.moveTo(0,y); pdfCtx.lineTo(1000,y); pdfCtx.stroke(); } } else if(bg==='graph'){ pdfCtx.strokeStyle='#e5e7eb'; for(let x=0;x<1000;x+=24){ pdfCtx.beginPath(); pdfCtx.moveTo(x,0); pdfCtx.lineTo(x,700); pdfCtx.stroke(); } for(let y=0;y<700;y+=24){ pdfCtx.beginPath(); pdfCtx.moveTo(0,y); pdfCtx.lineTo(1000,y); pdfCtx.stroke(); } } }
function redrawAll(){ pdfCanvas.width=1000; pdfCanvas.height=700; board.width=1000; board.height=700; let s=slides[curSlide]; if(s.pdfImage){ let img=new Image(); img.onload=()=>{ pdfCtx.clearRect(0,0,1000,700); pdfCtx.drawImage(img,0,0,1000,700); drawStrokes(); }; img.src=s.pdfImage; } else { if(!s.isPdf) drawBG(s.bg); drawStrokes(); } renderSlides(); updateLock(); }
function drawStrokes(){ ctx.clearRect(0,0,1000,700); slides[curSlide].strokes.forEach(st=>drawStroke(st)); }
function drawStroke(st){ ctx.save(); ctx.globalAlpha=st.type==='highlighter'?0.35:1; ctx.strokeStyle=st.color; ctx.lineWidth=st.size; ctx.lineCap='round'; if(st.type==='pen'||st.type==='highlighter'){ ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.stroke(); if(st.type==='highlighter'){ ctx.lineWidth=st.size*2.5; ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.stroke(); } } else if(st.type==='text'){ ctx.font=st.size*4+'px Arial'; ctx.fillStyle=st.color; ctx.fillText(st.text,st.x1,st.y1); } else if(st.type==='rect'){ ctx.strokeRect(st.x1,st.y1,st.x2-st.x1,st.y2-st.y1);} else if(st.type==='circle'){ let r=Math.hypot(st.x2-st.x1,st.y2-st.y1); ctx.beginPath(); ctx.arc(st.x1,st.y1,r,0,6.28); ctx.stroke(); } else if(st.type==='line'||st.type==='arrow'){ ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.stroke(); } else if(st.type==='triangle'){ ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.lineTo(st.x1-(st.x2-st.x1),st.y2); ctx.closePath(); ctx.stroke(); } else if(st.type==='axis'){ ctx.beginPath(); ctx.moveTo(500,0); ctx.lineTo(500,700); ctx.moveTo(0,350); ctx.lineTo(1000,350); ctx.stroke(); } ctx.restore(); }
function renderSlides(){ let strip=document.getElementById('slideStrip'); strip.innerHTML=''; slides.forEach((s,i)=>{ let d=document.createElement('div'); d.className='sItem'+(i===curSlide?' active':''); d.innerHTML='Slide '+(i+1)+'<span>'+(s.isPdf?'PDF':s.bg)+'</span>'; d.onclick=()=>switchSlide(i); strip.appendChild(d); }); }
function switchSlide(i){ curSlide=i; redrawAll(); broadcast({type:'switchSlide',idx:i}); }
function addNewSlide(bg){ slides.push({bg:bg,strokes:[],isPdf:false,pdfImage:null}); switchSlide(slides.length-1); broadcast({type:'newSlide',bg:bg}); }
function clearCurrent(b){ slides[curSlide].strokes=[]; ctx.clearRect(0,0,1000,700); if(b) broadcast({type:'clear',slide:curSlide}); }
function setTool(t){ curTool=t; document.querySelectorAll('.tB').forEach(b=>b.classList.remove('on')); document.querySelector('[data-t="'+t+'"]')?.classList.add('on'); board.classList.remove('cursor-pen','cursor-eraser','cursor-hand','cursor-text'); if(t==='pen'||t==='highlighter') board.classList.add('cursor-pen'); else if(t==='eraser'||t==='strokeEraser') board.classList.add('cursor-eraser'); else if(t==='hand') board.classList.add('cursor-hand'); else if(t==='text') board.classList.add('cursor-text'); if(t!=='pen') closeAllPops(); }
function updateLock(){ let tb=document.getElementById('floatTB'); if(!isTeacher &&!perms.canWrite) tb.classList.add('toolbarDisabled'); else tb.classList.remove('toolbarDisabled'); document.getElementById('connCount').textContent=dataConns.length; document.getElementById('partCount').textContent=dataConns.length+1; }
// DRAG WITH BOUNDARY - INSIDE WHITEBOARD ONLY
function initDrag(){
 let floatTB=document.getElementById('floatTB'), dragHead=document.getElementById('dragHead'), isDrag=false, offX=0,offY=0;
 if(!dragHead) return;
 dragHead.addEventListener('pointerdown',e=>{
   if(floatTB.classList.contains('dotMode')) return;
   isDrag=true; offX=e.clientX-floatTB.offsetLeft; offY=e.clientY-floatTB.offsetTop; dragHead.setPointerCapture(e.pointerId);
 });
 dragHead.addEventListener('pointermove',e=>{
   if(!isDrag) return;
   let wrapRect=boardWrap.getBoundingClientRect(); let tbW=floatTB.offsetWidth, tbH=floatTB.offsetHeight;
   let newL=e.clientX-offX, newT=e.clientY-offY;
   // constrain inside boardWrap
   let minL=0, maxL=wrapRect.width-tbW-4, minT=0, maxT=wrapRect.height-tbH-4;
   newL=Math.max(minL,Math.min(maxL,newL)); newT=Math.max(minT,Math.min(maxT,newT));
   floatTB.style.left=newL+'px'; floatTB.style.top=newT+'px';
 });
 dragHead.addEventListener('pointerup',()=>isDrag=false);
}
initDrag();
// DRAWING
let drawing=false,sx=0,sy=0,lx=0,ly=0;
board.addEventListener('pointerdown',e=>{
 if(curTool==='hand') return;
 if(curTool==='text'){ let r=board.getBoundingClientRect(); let x=(e.clientX-r.left)*(1000/r.width); let y=(e.clientY-r.top)*(700/r.height); let txt=prompt('Type text:'); if(!txt) return; let st={type:'text',x1:x,y1:y,text:txt,color:curColor,size:curSize,slide:curSlide}; slides[curSlide].strokes.push(st); drawStroke(st); broadcast(st); return; }
 if(!isTeacher &&!perms.canWrite){ log('Blocked'); return; }
 drawing=true; let r=board.getBoundingClientRect(); sx=(e.clientX-r.left)*(1000/r.width); sy=(e.clientY-r.top)*(700/r.height); lx=sx; ly=sy;
});
board.addEventListener('pointermove',e=>{
 if(!drawing || curTool==='hand') return; let r=board.getBoundingClientRect(); let x=(e.clientX-r.left)*(1000/r.width); let y=(e.clientY-r.top)*(700/r.height);
 if(curTool==='pen'){ let st={type:penType,x1:lx,y1:ly,x2:x,y2:y,color:curColor,size:curSize,slide:curSlide}; drawStroke(st); slides[curSlide].strokes.push(st); broadcast(st); }
 else if(curTool==='eraser'){ ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(x,y,20,0,6.28); ctx.fill(); ctx.globalCompositeOperation='source-over'; broadcast({type:'erasePixel',x,y,slide:curSlide}); }
 lx=x; ly=y;
});
board.addEventListener('pointerup',e=>{
 if(!drawing) return; drawing=false; let r=board.getBoundingClientRect(); let x=(e.clientX-r.left)*(1000/r.width); let y=(e.clientY-r.top)*(700/r.height);
 if(['rect','circle','line','arrow','triangle','axis'].includes(curTool)){ let st={type:curTool,x1:sx,y1:sy,x2:x,y2:y,color:curColor,size:curSize,slide:curSlide}; slides[curSlide].strokes.push(st); redrawAll(); broadcast(st); }
 else if(curTool==='strokeEraser'){ let s=slides[curSlide].strokes; for(let i=s.length-1;i>=0;i--){ if(Math.hypot(s[i].x1-x,s[i].y1-y)<50){ s.splice(i,1); break; } } redrawAll(); broadcast({type:'removeLast',slide:curSlide}); }
});
// BROWSER FEATURE - Inside whiteboard only
function openBrowser(){ document.getElementById('browserOverlay').style.display='flex'; log('Browser opened inside whiteboard'); }
function closeBrowser(){ document.getElementById('browserOverlay').style.display='none'; broadcast({type:'browserClose'}); }
function loadBrowser(){ let url=document.getElementById('browserUrl').value; if(!url.startsWith('http')) url='https://'+url; document.getElementById('browserFrame').src=url; broadcast({type:'browserOpen',url:url}); log('Browser: '+url); }
// PDF
async function renderPDFPage(){ if(!pdfDoc) return; let page=await pdfDoc.getPage(curPdfPage); let vp=page.getViewport({scale:1.4}); let tmp=document.createElement('canvas'); tmp.width=vp.width; tmp.height=vp.height; let tmpCtx=tmp.getContext('2d'); await page.render({canvasContext:tmpCtx,viewport:vp}).promise; let dataUrl=tmp.toDataURL('image/jpeg',0.7); slides[curSlide].pdfImage=dataUrl; slides[curSlide].isPdf=true; redrawAll(); document.getElementById('pdfFooter').classList.add('show'); document.getElementById('pgInfo').textContent='Page '+curPdfPage+'/'+pdfDoc.numPages; broadcast({type:'pdfImage',slide:curSlide,image:dataUrl}); }
async function loadPDF(f){ let buf=await f.arrayBuffer(); pdfDoc=await pdfjsLib.getDocument(buf).promise; curPdfPage=1; await renderPDFPage(); }
function zoomPDF(d){} function changePage(d){ if(!pdfDoc) return; let np=curPdfPage+d; if(np<1||np>pdfDoc.numPages) return; curPdfPage=np; renderPDFPage(); }
document.getElementById('pdfIn').addEventListener('change',e=>{ if(e.target.files[0]) loadPDF(e.target.files[0]); });
// PEER
let myPeer=null,myStream=null,dataConns=[],teacherId='tutor-mohan-'+room;
function broadcast(o){ dataConns.forEach(c=>{ try{ if(c.open) c.send(o);}catch{}}); }
function handleData(msg){
 if(['pen','highlighter','rect','circle','line','arrow','triangle','axis','text'].includes(msg.type)){ let idx=msg.slide||0; if(!slides[idx]) slides[idx]={bg:'white',strokes:[],isPdf:false,pdfImage:null}; slides[idx].strokes.push(msg); if(idx===curSlide) drawStroke(msg); }
 else if(msg.type==='pdfImage'){ let idx=msg.slide; if(!slides[idx]) slides[idx]={bg:'white',strokes:[],isPdf:true,pdfImage:null}; slides[idx].pdfImage=msg.image; slides[idx].isPdf=true; if(idx===curSlide) redrawAll(); }
 else if(msg.type==='browserOpen'){ document.getElementById('browserOverlay').style.display='flex'; document.getElementById('browserFrame').src=msg.url; document.getElementById('browserUrl').value=msg.url; }
 else if(msg.type==='browserClose'){ document.getElementById('browserOverlay').style.display='none'; }
 else if(msg.type==='erasePixel'){ if(msg.slide!==curSlide) return; ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(msg.x,msg.y,20,0,6.28); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
 else if(msg.type==='removeLast'){ if(slides[msg.slide]){ slides[msg.slide].strokes.pop(); if(msg.slide===curSlide) redrawAll(); } }
 else if(msg.type==='clear'){ if(slides[msg.slide]){ slides[msg.slide].strokes=[]; if(msg.slide===curSlide) ctx.clearRect(0,0,1000,700); } }
 else if(msg.type==='newSlide'){ slides.push({bg:msg.bg,strokes:[],isPdf:false,pdfImage:null}); renderSlides(); }
 else if(msg.type==='switchSlide'){ curSlide=msg.idx; redrawAll(); }
 else if(msg.type==='perms'){ perms=msg.perms; updateLock(); }
}
function addV(id,s,label){ let box=document.getElementById('vcBox'); let ex=document.getElementById('v-'+id); if(ex) ex.remove(); let tile=document.createElement('div'); tile.className='vTile'; tile.id='v-'+id; let v=document.createElement('video'); v.srcObject=s; v.autoplay=true; v.playsInline=true; if(id==='me') v.muted=true; v.play(); let l=document.createElement('div'); l.className='vLabel'; l.textContent=label; tile.appendChild(v); tile.appendChild(l); box.appendChild(tile); try{ let ac=new (window.AudioContext||window.webkitAudioContext)(); let src=ac.createMediaStreamSource(s); let analyser=ac.createAnalyser(); src.connect(analyser); setInterval(()=>{ let d=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(d); let avg=d.reduce((a,b)=>a+b,0)/d.length; tile.classList.toggle('speaking',avg>20); },300);}catch{} }
async function createTeacherPeer(){ myPeer=new Peer(teacherId); myPeer.on('open',()=>{ log('✅ TEACHER LIVE'); document.getElementById('status').textContent='🟢 TEACHER LIVE'; perms.canWrite=true; updateLock(); }); myPeer.on('call',c=>{ c.answer(myStream); c.on('stream',s=>addV(c.peer,s,'Student')); }); myPeer.on('connection',conn=>{ dataConns.push(conn); updateLock(); conn.on('data',handleData); conn.on('open',()=>{ conn.send({type:'perms',perms}); if(slides[curSlide].pdfImage) conn.send({type:'pdfImage',slide:curSlide,image:slides[curSlide].pdfImage}); }); }); myPeer.on('error',e=>{ if(e.type==='unavailable-id') setTimeout(()=>{ myPeer.destroy(); createTeacherPeer(); },2000); }); }
async function initVC(){ let box=document.getElementById('vcBox'); box.innerHTML=''; try{ myStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); }catch{ alert('Allow cam'); return; } addV('me',myStream,isTeacher?'Teacher':'Student'); if(isTeacher){ await createTeacherPeer(); } else { let sid='stu-'+Math.random().toString(36).slice(2,6); myPeer=new Peer(sid); myPeer.on('open',()=>setTimeout(callTeacher,800)); } }
function callTeacher(){ let call=myPeer.call(teacherId,myStream); if(!call){ document.getElementById('status').textContent='⏳ Waiting...'; setTimeout(callTeacher,3000); return; } call.on('stream',s=>addV('teacher',s,'Teacher')); let conn=myPeer.connect(teacherId); conn.on('open',()=>{ dataConns.push(conn); updateLock(); document.getElementById('status').textContent='🟢 BOARD LINKED'; }); conn.on('data',handleData); }
function togCls(){ let isStart=document.getElementById('clsTx').textContent.includes('Start')||document.getElementById('clsTx').textContent.includes('Join'); if(isStart){ document.getElementById('clsTx').textContent=isTeacher?'End':'Leave'; document.getElementById('clsBtn').style.background='#0f172a'; initVC(); } else { if(myStream) myStream.getTracks().forEach(x=>x.stop()); if(myPeer) myPeer.destroy(); location.reload(); } }
redrawAll(); setTool('pen'); log('Toolbar: drag from ⋮⋮, stays inside whiteboard, click ● to collapse to dot');
