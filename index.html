<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor Mohan - Thin Toolbar</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:52px;background:#020617;border-bottom:2px solid #22c55e;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.logo{width:32px;height:32px;background:#22c55e;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.main{flex:1;display:flex;overflow:hidden}.left{flex:1;position:relative;background:#525659;overflow:hidden}
.wrap{width:100%;height:100%;position:relative;overflow:auto;display:flex;justify-content:center;padding:10px}
#pdfCanvas{position:absolute;box-shadow:0 0 12px #000;width:1000px;height:700px} #board{position:absolute;z-index:2;width:1000px;height:700px;touch-action:none}
.right{width:340px;background:#0f172a;border-left:1px solid #1e293b;display:flex;flex-direction:column;padding:8px;gap:8px}
#vcBox{height:180px;background:#000;border:2px solid #22c55e;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px} video{width:100%;height:100%;object-fit:cover;background:#111}
#status{padding:7px;border-radius:8px;background:#020617;border:1px solid #22c55e;font-size:11px}
.btn{padding:6px 10px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#fff;font-weight:700;cursor:pointer;font-size:11px}

/* THIN FLOATING DRAGGABLE TOOLBAR */
.floatTB{position:absolute;left:12px;top:12px;z-index:30;width:56px;background:#0f172a;border:1px solid #334155;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;user-select:none;touch-action:none}
.tbHeader{height:22px;background:#020617;display:flex;align-items:center;justify-content:space-between;padding:0 6px;cursor:grab;font-size:10px;color:#94a3b8}
.tbHeader:active{cursor:grabbing}
.tbBody{padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.tbBody.collapsed{display:none}
.tBtn{width:40px;height:40px;border-radius:9px;border:2px solid transparent;background:#1e293b;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.tBtn.on{border-color:#22c55e;background:#22c55e;color:#000}
.tBtn.small{width:32px;height:32px;font-size:14px}
.popup{position:absolute;left:58px;top:0;background:#020617;border:1px solid #334155;border-radius:10px;padding:8px;display:none;flex-direction:column;gap:6px;z-index:40;min-width:90px;box-shadow:0 8px 20px #000}
.popup.show{display:flex}
.popupRow{display:flex;gap:6px;align-items:center}
.colorDot{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 2px #000}
.paletteGrid{display:grid;grid-template-columns:repeat(4,24px);gap:6px}
.c{width:24px;height:24px;border-radius:50%;border:2px solid #fff;cursor:pointer}
.thickBtn{width:40px;height:28px;border-radius:6px;background:#1e293b;border:2px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.thickBtn.on{border-color:#22c55e}
.thickDot{border-radius:50%;background:#fff}
.toolbarDisabled{opacity:.2;pointer-events:none}
.slideBar{display:flex;gap:4px;overflow:auto;background:#020617;padding:4px;border-radius:6px}.slideThumb{width:56px;height:38px;background:#fff;border:2px solid transparent;border-radius:4px;flex-shrink:0}.slideThumb.active{border-color:#22c55e}
.cursor-pen{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><text y="20" font-size="20">✏️</text></svg>') 0 24,crosshair}
.cursor-eraser{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><text y="20" font-size="20">🧹</text></svg>') 12 12,cell}
.cursor-hand{cursor:grab}.cursor-hand:active{cursor:grabbing}
</style></head><body>
<div class="top"><div style="display:flex;align-items:center;gap:8px"><div class="logo">M</div><div style="font-weight:900;font-size:13px">TUTOR MOHAN</div><div id="roomLabel" style="background:#1e293b;padding:3px 8px;border-radius:20px;font-size:10px"></div></div><button id="clsBtn" class="btn" style="background:#22c55e;color:#000" onclick="togCls()"><span id="clsTx">Start</span></button></div>
<div class="main"><div class="left"><div class="wrap" id="wrap"><canvas id="pdfCanvas"></canvas><canvas id="board"></canvas>

<!-- THIN FLOATING TOOLBAR -->
<div class="floatTB" id="floatTB">
<div class="tbHeader" id="tbDrag">⋮⋮ <span id="collapseBtn" style="cursor:pointer" onclick="toggleCollapse()">─</span></div>
<div class="tbBody" id="tbBody">
<!-- 1. HAND -->
<button class="tBtn" data-t="hand" onclick="setTool('hand')" title="Hand / Pan">✋</button>
<!-- 2. PENCIL + POPUP -->
<div style="position:relative">
<button class="tBtn on" data-t="pen" id="penMainBtn" onclick="togglePenPopup()" title="Pencil">✏️</button>
<div class="popup" id="penPopup">
<div style="font-size:10px;color:#94a3b8">PENCIL TYPE</div>
<button class="tBtn small on" data-pt="pen" onclick="setPenType('pen')">✏️ Pencil</button>
<button class="tBtn small" data-pt="highlighter" onclick="setPenType('highlighter')" style="background:#fef08a;color:#000">🖍️ Highlighter</button>
<div style="height:1px;background:#334155;margin:4px 0"></div>
<div style="font-size:10px;color:#94a3b8">THICKNESS - Proper</div>
<div style="display:flex;flex-direction:column;gap:4px">
<button class="thickBtn" onclick="setSize(3)"><div class="thickDot" style="width:3px;height:3px"></div></button>
<button class="thickBtn on" onclick="setSize(6)"><div class="thickDot" style="width:6px;height:6px"></div></button>
<button class="thickBtn" onclick="setSize(10)"><div class="thickDot" style="width:10px;height:10px"></div></button>
<button class="thickBtn" onclick="setSize(16)"><div class="thickDot" style="width:16px;height:16px"></div></button>
</div>
</div>
</div>
<!-- 3. SHAPES + POPUP -->
<div style="position:relative">
<button class="tBtn" data-t="shape" id="shapeMainBtn" onclick="toggleShapePopup()" title="Shapes">⬜</button>
<div class="popup" id="shapePopup" style="min-width:120px">
<div style="font-size:10px;color:#94a3b8">MATH SHAPES</div>
<div class="paletteGrid">
<button class="tBtn small" onclick="setTool('rect')" title="Rectangle">⬜</button>
<button class="tBtn small" onclick="setTool('circle')" title="Circle">⭕</button>
<button class="tBtn small" onclick="setTool('line')" title="Line">📏</button>
<button class="tBtn small" onclick="setTool('arrow')" title="Arrow">➡️</button>
<button class="tBtn small" onclick="setTool('triangle')" title="Triangle">🔺</button>
<button class="tBtn small" onclick="setTool('axis')" title="Axis / Graph">📈</button>
<button class="tBtn small" onclick="setTool('bracket')" title="Bracket">()</button>
</div>
</div>
</div>
<!-- 4. ERASER + POPUP -->
<div style="position:relative">
<button class="tBtn" data-t="eraser" id="eraserMainBtn" onclick="toggleEraserPopup()" title="Eraser">🧹</button>
<div class="popup" id="eraserPopup">
<div style="font-size:10px;color:#94a3b8">ERASER TYPE</div>
<button class="tBtn small on" data-et="pixel" onclick="setEraserType('pixel')" title="Part Erase">🧹 Part Erase</button>
<button class="tBtn small" data-et="stroke" onclick="setEraserType('stroke')" title="Full Stroke">🗑️ Stroke Erase</button>
<button class="tBtn small" onclick="clearCurrent(true)" title="Clear Page" style="background:#ef4444">🧼 Clear Page</button>
</div>
</div>
<!-- 5. COLOR -->
<div style="position:relative">
<div class="colorDot" id="curColorDot" style="background:#000000" onclick="toggleColorPopup()" title="Color"></div>
<div class="popup" id="colorPopup" style="left:50px">
<div style="font-size:10px;color:#94a3b8">12 COLORS</div>
<div class="paletteGrid" id="pal"></div>
</div>
</div>
<div style="height:1px;background:#334155;width:100%"></div>
<button class="tBtn small teacherOnly" onclick="document.getElementById('pdfIn').click()" title="PDF">📄</button>
<button class="tBtn small teacherOnly" onclick="switchToWhiteboard()" title="White">⬜</button>
</div>
</div>

</div>
<div id="pdfFooter" style="display:none;position:absolute;bottom:0;left:0;right:0;background:#020617;border-top:1px solid #334155;padding:6px;justify-content:center;gap:6px;z-index:20"><button class="btn" onclick="zoomPDF(0.2)">Zoom+</button><button class="btn" onclick="zoomPDF(-0.2)">Zoom-</button><button class="btn" onclick="changePage(-1)">◀</button><span id="pgInfo" style="font-size:11px">Whiteboard</span><button class="btn" onclick="changePage(1)">▶</button></div>
</div>
<div class="right"><div id="status">⚫ OFFLINE</div><div id="vcBox"><div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:#666;font-size:11px">Video</div></div>
<div style="display:flex;gap:4px"><button class="btn" style="flex:1" onclick="togMic()">Mic</button><button class="btn" style="flex:1" onclick="togCam()">Cam</button><button class="btn" style="flex:1" onclick="retryConnect()">Reconnect</button></div>
<div id="permPanel" style="background:#020617;border:1px solid #334155;border-radius:8px;padding:8px"><b style="font-size:11px">Teacher Controls</b><br><label style="font-size:11px"><input type="checkbox" id="pWrite"> Allow Student Write</label><br><button class="btn" style="width:100%;margin-top:6px;background:#ef4444" onclick="endClassForAll()">End For All</button><div style="font-size:10px;margin-top:4px;color:#22c55e">Boards: <span id="connCount">0</span></div></div>
<div id="log" style="height:70px;background:#020617;border:1px solid #1e293b;border-radius:6px;padding:4px;overflow:auto;font-size:10px"></div>
</div></div>
<input type="file" id="pdfIn" accept="application/pdf" hidden>
<script>
let room=(new URLSearchParams(location.search).get('room')||'mohan-class-1').toLowerCase().replace(/[^a-z0-9-]/g,'-'); let role=new URLSearchParams(location.search).get('role')||'teacher'; let isTeacher=role==='teacher';
document.getElementById('roomLabel').textContent=room+' | '+role.toUpperCase();
if(!isTeacher){ document.getElementById('clsTx').textContent='Join'; document.getElementById('permPanel').style.display='none'; }
let pdfCanvas=document.getElementById('pdfCanvas'), pdfCtx=pdfCanvas.getContext('2d'), board=document.getElementById('board'), ctx=board.getContext('2d'), wrap=document.getElementById('wrap');
function log(t){ let e=document.getElementById('log'); let d=document.createElement('div'); d.textContent=new Date().toLocaleTimeString()+': '+t; e.appendChild(d); e.scrollTop=9999; }
let palette=['#000000','#ff0000','#00a8ff','#22c55e','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#ffffff','#ff8c00','#00ffff','#a3e635'];
let curColor='#000000', curSize=6, curTool='pen', penType='pen', eraserType='pixel'; let slides=[{bg:'white',strokes:[],isPdf:false}], curSlide=0, pdfDoc=null, curPdfPage=1, pdfScale=1.2, perms={canWrite:false};
let pal=document.getElementById('pal'); palette.forEach(c=>{ let d=document.createElement('div'); d.className='c'; d.style.background=c; d.onclick=()=>{ curColor=c; document.getElementById('curColorDot').style.background=c; document.getElementById('colorPopup').classList.remove('show'); log('Color '+c); }; pal.appendChild(d); });
function setSize(s){ curSize=s; document.querySelectorAll('.thickBtn').forEach(b=>b.classList.remove('on')); event.currentTarget.classList.add('on'); log('Thickness '+s+'px'); }
function toggleCollapse(){ document.getElementById('tbBody').classList.toggle('collapsed'); }
function togglePenPopup(){ document.getElementById('penPopup').classList.toggle('show'); document.getElementById('shapePopup').classList.remove('show'); document.getElementById('eraserPopup').classList.remove('show'); document.getElementById('colorPopup').classList.remove('show'); }
function toggleShapePopup(){ document.getElementById('shapePopup').classList.toggle('show'); document.getElementById('penPopup').classList.remove('show'); document.getElementById('eraserPopup').classList.remove('show'); document.getElementById('colorPopup').classList.remove('show'); }
function toggleEraserPopup(){ document.getElementById('eraserPopup').classList.toggle('show'); document.getElementById('penPopup').classList.remove('show'); document.getElementById('shapePopup').classList.remove('show'); document.getElementById('colorPopup').classList.remove('show'); }
function toggleColorPopup(){ document.getElementById('colorPopup').classList.toggle('show'); document.getElementById('penPopup').classList.remove('show'); document.getElementById('shapePopup').classList.remove('show'); document.getElementById('eraserPopup').classList.remove('show'); }
function setPenType(t){ penType=t; document.querySelectorAll('[data-pt]').forEach(b=>b.classList.remove('on')); document.querySelector('[data-pt="'+t+'"]')?.classList.add('on'); setTool('pen'); document.getElementById('penPopup').classList.remove('show'); log('Pen type '+t); }
function setEraserType(t){ eraserType=t; document.querySelectorAll('[data-et]').forEach(b=>b.classList.remove('on')); document.querySelector('[data-et="'+t+'"]')?.classList.add('on'); curTool=t==='pixel'?'eraser':'strokeEraser'; setTool(curTool); document.getElementById('eraserPopup').classList.remove('show'); }
function drawBG(bg){ pdfCtx.fillStyle='#fff'; pdfCtx.fillRect(0,0,1000,700); if(bg==='ruled'){ pdfCtx.strokeStyle='#93c5fd'; for(let y=40;y<700;y+=32){ pdfCtx.beginPath(); pdfCtx.moveTo(0,y); pdfCtx.lineTo(1000,y); pdfCtx.stroke(); } } else if(bg==='graph'){ pdfCtx.strokeStyle='#ddd'; for(let x=0;x<1000;x+=24){ pdfCtx.beginPath(); pdfCtx.moveTo(x,0); pdfCtx.lineTo(x,700); pdfCtx.stroke(); } for(let y=0;y<700;y+=24){ pdfCtx.beginPath(); pdfCtx.moveTo(0,y); pdfCtx.lineTo(1000,y); pdfCtx.stroke(); } } }
function redrawAll(){ pdfCanvas.width=1000; pdfCanvas.height=700; board.width=1000; board.height=700; let s=slides[curSlide]; if(!s.isPdf) drawBG(s.bg); ctx.clearRect(0,0,1000,700); s.strokes.forEach(st=>drawStroke(st)); updateLock(); }
function drawStroke(st){ ctx.save(); ctx.globalAlpha=st.alpha||1; ctx.strokeStyle=st.color; ctx.lineWidth=st.size; ctx.lineCap='round'; if(st.type==='pen'){ ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.stroke(); } else if(st.type==='highlighter'){ ctx.globalAlpha=0.4; ctx.lineWidth=st.size*2; ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.stroke(); } else if(st.type==='rect'){ ctx.strokeRect(st.x1,st.y1,st.x2-st.x1,st.y2-st.y1);} else if(st.type==='circle'){ let r=Math.hypot(st.x2-st.x1,st.y2-st.y1); ctx.beginPath(); ctx.arc(st.x1,st.y1,r,0,6.28); ctx.stroke(); } else if(st.type==='line'||st.type==='arrow'){ ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.stroke(); } else if(st.type==='triangle'){ ctx.beginPath(); ctx.moveTo(st.x1,st.y1); ctx.lineTo(st.x2,st.y2); ctx.lineTo(st.x1-(st.x2-st.x1),st.y2); ctx.closePath(); ctx.stroke(); } else if(st.type==='axis'){ ctx.beginPath(); ctx.moveTo(500,0); ctx.lineTo(500,700); ctx.moveTo(0,350); ctx.lineTo(1000,350); ctx.stroke(); } ctx.restore(); }
function switchSlide(i){ curSlide=i; redrawAll(); broadcast({type:'switchSlide',idx:i}); } function addNewSlide(bg){ if(!isTeacher) return; slides.push({bg:bg,strokes:[],isPdf:false}); switchSlide(slides.length-1); broadcast({type:'newSlide',bg:bg}); } function switchToWhiteboard(){ addNewSlide('white'); pdfDoc=null; document.getElementById('pdfFooter').style.display='none'; } function clearCurrent(b){ slides[curSlide].strokes=[]; ctx.clearRect(0,0,1000,700); if(b) broadcast({type:'clear',slide:curSlide}); }
function setTool(t){
 curTool=t; document.querySelectorAll('.tBtn').forEach(b=>b.classList.remove('on')); if(['pen','highlighter'].includes(t)) document.getElementById('penMainBtn')?.classList.add('on'); else document.querySelector('[data-t="'+t+'"]')?.classList.add('on');
 board.classList.remove('cursor-pen','cursor-eraser','cursor-hand'); if(t==='pen'||t==='highlighter') board.classList.add('cursor-pen'); else if(t==='eraser'||t==='strokeEraser') board.classList.add('cursor-eraser'); else if(t==='hand') board.classList.add('cursor-hand');
 // close popups after shape select
 if(['rect','circle','line','arrow','triangle','axis'].includes(t)){ document.getElementById('shapePopup').classList.remove('show'); }
}
function updateLock(){ let tb=document.getElementById('floatTB'); if(!isTeacher &&!perms.canWrite){ tb.classList.add('toolbarDisabled'); } else { tb.classList.remove('toolbarDisabled'); } document.getElementById('connCount').textContent=dataConns.length; }
// DRAGGABLE
let dragEl=document.getElementById('floatTB'), dragHandle=document.getElementById('tbDrag'), dX=0,dY=0, dragging=false;
dragHandle.addEventListener('pointerdown',e=>{ dragging=true; dX=e.clientX-dragEl.offsetLeft; dY=e.clientY-dragEl.offsetTop; dragHandle.setPointerCapture(e.pointerId); });
dragHandle.addEventListener('pointermove',e=>{ if(!dragging) return; dragEl.style.left=(e.clientX-dX)+'px'; dragEl.style.top=(e.clientY-dY)+'px'; });
dragHandle.addEventListener('pointerup',()=>dragging=false);
// HAND PANNING
let isPanning=false, sX,sY, sL,sT;
wrap.addEventListener('pointerdown',e=>{ if(curTool!=='hand') return; isPanning=true; sX=e.pageX-wrap.offsetLeft; sY=e.pageY-wrap.offsetTop; sL=wrap.scrollLeft; sT=wrap.scrollTop; });
wrap.addEventListener('pointermove',e=>{ if(!isPanning) return; wrap.scrollLeft=sL-(e.pageX-wrap.offsetLeft-sX); wrap.scrollTop=sT-(e.pageY-wrap.offsetTop-sY); });
wrap.addEventListener('pointerup',()=>isPanning=false);
// DRAWING - PenTab Friendly
let drawing=false,sx=0,sy=0,lx=0,ly=0;
board.addEventListener('pointerdown',e=>{
 if(curTool==='hand') return; if(!isTeacher &&!perms.canWrite){ log('Blocked'); return; }
 drawing=true; let r=board.getBoundingClientRect(); sx=(e.clientX-r.left)*(1000/r.width); sy=(e.clientY-r.top)*(700/r.height); lx=sx; ly=sy;
});
board.addEventListener('pointermove',e=>{
 if(!drawing || curTool==='hand') return; let r=board.getBoundingClientRect(); let x=(e.clientX-r.left)*(1000/r.width); let y=(e.clientY-r.top)*(700/r.height);
 if(curTool==='pen'||penType==='highlighter'&&curTool==='pen'){ let type=penType==='highlighter'?'highlighter':'pen'; let st={type:type,x1:lx,y1:ly,x2:x,y2:y,color:curColor,size:curSize,slide:curSlide, alpha: type==='highlighter'?0.4:1}; drawStroke(st); slides[curSlide].strokes.push(st); broadcast(st); }
 else if(curTool==='eraser'){ ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(x,y,18,0,6.28); ctx.fill(); ctx.globalCompositeOperation='source-over'; broadcast({type:'erasePixel',x,y,slide:curSlide}); }
 lx=x; ly=y;
});
board.addEventListener('pointerup',e=>{
 if(!drawing) return; drawing=false; let r=board.getBoundingClientRect(); let x=(e.clientX-r.left)*(1000/r.width); let y=(e.clientY-r.top)*(700/r.height);
 if(['rect','circle','line','arrow','triangle','axis'].includes(curTool)){ let st={type:curTool,x1:sx,y1:sy,x2:x,y2:y,color:curColor,size:curSize,slide:curSlide}; slides[curSlide].strokes.push(st); redrawAll(); broadcast(st); }
 else if(curTool==='strokeEraser'){ let s=slides[curSlide].strokes; for(let i=s.length-1;i>=0;i--){ if(Math.hypot(s[i].x1-x,s[i].y1-y)<60){ s.splice(i,1); break; } } redrawAll(); broadcast({type:'removeLast',slide:curSlide}); }
});
async function renderPDFPage(){ if(!pdfDoc) return; let page=await pdfDoc.getPage(curPdfPage); let vp=page.getViewport({scale:pdfScale}); pdfCanvas.width=vp.width; pdfCanvas.height=vp.height; board.width=vp.width; board.height=vp.height; pdfCanvas.style.width=vp.width+'px'; board.style.width=vp.width+'px'; pdfCanvas.style.height=vp.height+'px'; board.style.height=vp.height+'px'; await page.render({canvasContext:pdfCtx,viewport:vp}).promise; document.getElementById('pgInfo').textContent='Page '+curPdfPage+'/'+pdfDoc.numPages; ctx.clearRect(0,0,board.width,board.height); slides[curSlide].strokes.forEach(s=>drawStroke(s)); document.getElementById('pdfFooter').style.display='flex'; }
async function loadPDF(f){ let buf=await f.arrayBuffer(); pdfDoc=await pdfjsLib.getDocument(buf).promise; curPdfPage=1; pdfScale=1.2; slides[curSlide]={bg:'pdf',strokes:[],isPdf:true}; await renderPDFPage(); }
function zoomPDF(d){ if(!pdfDoc) return; pdfScale=Math.max(0.4,Math.min(3,pdfScale+d)); renderPDFPage(); broadcast({type:'zoom',scale:pdfScale}); }
function changePage(d){ if(!pdfDoc) return; let np=curPdfPage+d; if(np<1||np>pdfDoc.numPages) return; curPdfPage=np; renderPDFPage(); broadcast({type:'pdfPage',page:np}); }
document.getElementById('pdfIn').addEventListener('change',e=>{ if(e.target.files[0]) loadPDF(e.target.files[0]); });
let myPeer=null,myStream=null,dataConns=[],teacherId='tutor-mohan-'+room;
function broadcast(o){ dataConns.forEach(c=>{ try{ if(c.open) c.send(o);}catch{}}); }
function handleData(msg){
 if(['pen','highlighter','rect','circle','line','arrow','triangle','axis'].includes(msg.type)){ let idx=msg.slide||0; if(!slides[idx]) slides[idx]={bg:'white',strokes:[],isPdf:false}; slides[idx].strokes.push(msg); if(idx===curSlide){ drawStroke(msg); if(msg.type!=='pen'&&msg.type!=='highlighter') redrawAll(); } }
 else if(msg.type==='erasePixel'){ if(msg.slide!==curSlide) return; ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(msg.x,msg.y,18,0,6.28); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
 else if(msg.type==='removeLast'){ if(slides[msg.slide]){ slides[msg.slide].strokes.pop(); if(msg.slide===curSlide) redrawAll(); } }
 else if(msg.type==='clear'){ if(slides[msg.slide]){ slides[msg.slide].strokes=[]; if(msg.slide===curSlide) ctx.clearRect(0,0,1000,700); } }
 else if(msg.type==='newSlide'){ slides.push({bg:msg.bg,strokes:[],isPdf:false}); } else if(msg.type==='switchSlide'){ curSlide=msg.idx; redrawAll(); }
 else if(msg.type==='perms'){ perms=msg.perms; updateLock(); } else if(msg.type==='classEnded'){ location.reload(); } else if(msg.type==='zoom'){ pdfScale=msg.scale; if(pdfDoc) renderPDFPage(); } else if(msg.type==='pdfPage'){ curPdfPage=msg.page; if(pdfDoc) renderPDFPage(); }
}
function addV(id,s){ let box=document.getElementById('vcBox'); if(document.getElementById('v-'+id)) return; let v=document.createElement('video'); v.id='v-'+id; v.srcObject=s; v.autoplay=true; v.playsInline=true; if(id==='me') v.muted=true; v.play(); box.appendChild(v); }
async function createTeacherPeer(){ myPeer=new Peer(teacherId); myPeer.on('open',()=>{ log('✅ TEACHER LIVE'); document.getElementById('status').textContent='🟢 TEACHER LIVE - '+room; perms.canWrite=true; updateLock(); }); myPeer.on('call',call=>{ call.answer(myStream); call.on('stream',s=>addV(call.peer,s)); }); myPeer.on('connection',conn=>{ dataConns.push(conn); updateLock(); conn.on('data',handleData); conn.on('open',()=>conn.send({type:'perms',perms})); }); myPeer.on('error',e=>{ if(e.type==='unavailable-id') setTimeout(()=>{ myPeer.destroy(); createTeacherPeer(); },2000); }); }
async function initVC(){ let box=document.getElementById('vcBox'); box.innerHTML=''; try{ myStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); }catch{ alert('Allow camera'); return; } addV('me',myStream); if(isTeacher){ await createTeacherPeer(); } else { let sid='stu-'+Math.random().toString(36).slice(2,6); myPeer=new Peer(sid); myPeer.on('open',()=>setTimeout(callTeacher,800)); } }
function callTeacher(){ let call=myPeer.call(teacherId,myStream); if(!call){ document.getElementById('status').textContent='⏳ Waiting...'; setTimeout(callTeacher,3000); return; } call.on('stream',s=>{ addV('teacher',s); document.getElementById('status').textContent='🟢 CONNECTED'; }); let conn=myPeer.connect(teacherId); conn.on('open',()=>{ dataConns.push(conn); updateLock(); document.getElementById('status').textContent='🟢 BOARD LINKED'; }); conn.on('data',handleData); }
function retryConnect(){ if(!isTeacher) callTeacher(); }
async function togCls(){ let isStart=document.getElementById('clsTx').textContent.includes('Start')||document.getElementById('clsTx').textContent.includes('Join'); if(isStart){ document.getElementById('clsTx').textContent=isTeacher?'End':'Leave'; document.getElementById('clsBtn').style.background='#ef4444'; await initVC(); } else { if(myStream) myStream.getTracks().forEach(x=>x.stop()); if(myPeer) myPeer.destroy(); location.reload(); } }
function endClassForAll(){ broadcast({type:'classEnded'}); if(myStream) myStream.getTracks().forEach(x=>x.stop()); if(myPeer) myPeer.destroy(); location.reload(); }
function togMic(){ if(myStream) myStream.getAudioTracks().forEach(a=>a.enabled=!a.enabled); } function togCam(){ if(myStream) myStream.getVideoTracks().forEach(a=>a.enabled=!a.enabled); }
document.getElementById('pWrite')?.addEventListener('change',e=>{ perms.canWrite=e.target.checked; broadcast({type:'perms',perms}); updateLock(); });
redrawAll(); setTool('pen'); log('Thin draggable toolbar ready - Drag from top ⋮⋮ - Click ─ to collapse');
</script></body></html>
