<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tutorMohan — Whiteboard Classroom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PeerJS for WebRTC -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- PDF.js for rendering PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <!-- jsPDF for downloading annotated board -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: #f3f4f6; }
        .toolbar-btn { transition: all 0.2s ease; }
        .toolbar-btn:hover { transform: scale(1.08); }
        .active-tool { background-color: #3b82f6 !important; color: white !important; }
        #whiteboard-container { position: relative; width: 100%; height: calc(100vh - 64px); background-color: #ffffff; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; cursor: crosshair; }
        #pdf-canvas { z-index: 5; pointer-events: none; }
        .laser-pointer { position: absolute; width: 12px; height: 12px; background-color: #ef4444; border-radius: 50%; box-shadow: 0 0 10px #ef4444; pointer-events: none; z-index: 100; transition: opacity 1s ease; }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 text-white select-none">
        <div class="flex items-center space-x-4">
            <div class="text-2xl font-bold tracking-tight">
                <span class="text-blue-400">tutor</span><span class="text-orange-500">Mohan</span>
            </div>
            <div class="bg-slate-800 px-3 py-1 rounded text-xs text-slate-400 font-mono" id="room-display">
                Room: Connecting...
            </div>
        </div>

        <!-- Mode & Info Controls -->
        <div class="flex items-center space-x-3">
            <span id="role-badge" class="bg-blue-600 text-xs px-2.5 py-1 rounded-full font-semibold uppercase tracking-wider">Teacher</span>
            
            <button id="btn-record" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm flex items-center space-x-2 font-medium">
                <i class="fas fa-circle text-xs animate-pulse"></i>
                <span id="record-text">Start Record</span>
            </button>

            <button id="btn-save-board" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm flex items-center space-x-2 font-medium">
                <i class="fas fa-download"></i>
                <span>Save Board</span>
            </button>
        </div>
    </header>

    <!-- MAIN INTERFACE CONTAINER -->
    <div class="flex w-full h-[calc(100vh-64px)] relative">
        
        <!-- SIDE PANEL (Left side: Chat & Student Permissions) -->
        <aside class="w-80 bg-slate-800 border-r border-slate-700 flex flex-col z-20 text-slate-200">
            <!-- Tabs -->
            <div class="flex border-b border-slate-700">
                <button id="tab-users" class="flex-1 py-3 text-center font-medium bg-slate-700 border-b-2 border-blue-500">
                    <i class="fas fa-users mr-2"></i>Classroom
                </button>
                <button id="tab-chat" class="flex-1 py-3 text-center font-medium hover:bg-slate-700">
                    <i class="fas fa-comments mr-2"></i>Live Chat
                </button>
            </div>

            <!-- Panel Contents -->
            <div class="flex-1 overflow-y-auto p-4" id="panel-users-content">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Participants</h3>
                <ul id="user-list" class="space-y-3">
                    <!-- Example Teacher Item -->
                    <li class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-medium text-sm flex items-center">
                                <i class="fas fa-user-tie text-blue-400 mr-2"></i> You (Teacher)
                            </span>
                        </div>
                    </li>
                    <!-- Mock Student Item for Demo/Controls -->
                    <li class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-medium text-sm flex items-center">
                                <i class="fas fa-user text-orange-400 mr-2"></i> Student_Demo
                            </span>
                            <span class="text-xs bg-slate-800 text-emerald-400 px-1.5 py-0.5 rounded">Online</span>
                        </div>
                        <div class="flex items-center justify-start space-x-3 text-xs pt-1 border-t border-slate-800 text-slate-400">
                            <label class="flex items-center cursor-pointer hover:text-white">
                                <input type="checkbox" checked class="mr-1 accent-blue-500 toggle-perm" data-perm="draw"> Draw
                            </label>
                            <label class="flex items-center cursor-pointer hover:text-white">
                                <input type="checkbox" checked class="mr-1 accent-blue-500 toggle-perm" data-perm="chat"> Chat
                            </label>
                            <label class="flex items-center cursor-pointer hover:text-white">
                                <input type="checkbox" checked class="mr-1 accent-blue-500 toggle-perm" data-perm="screen"> Screen
                            </label>
                        </div>
                    </li>
                </ul>

                <!-- AV Feeds Grid Container Inside Side Panel -->
                <div class="mt-6 border-t border-slate-700 pt-4">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Video Streams</h3>
                    <div class="grid grid-cols-1 gap-2" id="video-grid">
                        <div class="relative bg-slate-900 aspect-video rounded overflow-hidden border border-slate-700">
                            <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                            <div class="absolute bottom-1 left-1 bg-black/60 px-1.5 py-0.5 rounded text-[10px]">Local Camera</div>
                        </div>
                    </div>
                    <div class="mt-3 flex space-x-2">
                        <button id="btn-toggle-cam" class="flex-1 bg-slate-700 hover:bg-slate-600 p-2 rounded text-xs text-center font-medium">
                            <i class="fas fa-video mr-1"></i> Cam
                        </button>
                        <button id="btn-toggle-mic" class="flex-1 bg-slate-700 hover:bg-slate-600 p-2 rounded text-xs text-center font-medium">
                            <i class="fas fa-microphone mr-1"></i> Mic
                        </button>
                        <button id="btn-share-screen" class="flex-1 bg-slate-700 hover:bg-slate-600 p-2 rounded text-xs text-center font-medium">
                            <i class="fas fa-desktop mr-1"></i> Share
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chat Content Container (Hidden by default) -->
            <div class="flex-1 flex flex-col hidden p-4" id="panel-chat-content">
                <div id="chat-messages" class="flex-1 bg-slate-900/40 border border-slate-700 rounded-lg p-3 overflow-y-auto space-y-2 mb-3 text-sm">
                    <div class="text-slate-500 text-xs text-center">Welcome to tutorMohan chat room!</div>
                </div>
                <div class="flex space-x-2">
                    <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    <button id="btn-send-chat" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-sm font-medium">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- WHITEBOARD WORKSPACE -->
        <main class="flex-1 relative bg-white" id="whiteboard-workspace">
            
            <!-- Navigation toolbar for Multi-slides / PDF pages -->
            <div class="absolute top-4 left-4 z-30 bg-slate-900/95 shadow-xl border border-slate-800 backdrop-blur text-white px-3 py-2 rounded-lg flex items-center space-x-4 select-none">
                <button id="btn-prev-slide" class="p-1.5 hover:bg-slate-800 rounded disabled:opacity-40">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <span class="text-sm font-medium" id="slide-info">Slide 1 / 1</span>
                <button id="btn-next-slide" class="p-1.5 hover:bg-slate-800 rounded">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <div class="h-4 w-[1px] bg-slate-700"></div>
                <button id="btn-add-slide" class="text-xs bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded flex items-center space-x-1">
                    <i class="fas fa-plus"></i> <span>Add Slide</span>
                </button>
            </div>

            <!-- FLOATING VERTICAL TOOLBAR -->
            <div class="absolute right-4 top-1/2 -translate-y-1/2 z-30 bg-slate-900/95 shadow-2xl border border-slate-800 backdrop-blur rounded-2xl p-2.5 flex flex-col space-y-3 items-center">
                
                <!-- Drawing Tools -->
                <button id="tool-pencil" class="toolbar-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-800 active-tool" title="Pencil">
                    <i class="fas fa-pencil-alt text-lg"></i>
                </button>
                
                <button id="tool-highlighter" class="toolbar-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-800" title="Highlighter">
                    <i class="fas fa-marker text-lg"></i>
                </button>
                
                <button id="tool-laser" class="toolbar-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-800" title="Laser Pointer">
                    <i class="fas fa-eye text-lg"></i>
                </button>

                <button id="tool-eraser" class="toolbar-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-800" title="Eraser">
                    <i class="fas fa-eraser text-lg"></i>
                </button>

                <!-- Color Palette Switcher -->
                <div class="relative group">
                    <button id="btn-color-picker" class="w-7 h-7 rounded-full border border-white bg-black" title="Color Palette"></button>
                    <!-- Quick Colors Popout -->
                    <div class="absolute right-12 top-0 bg-slate-900 border border-slate-800 p-2 rounded-xl flex space-x-1.5 shadow-xl hidden group-hover:flex">
                        <div class="w-5 h-5 rounded-full bg-black cursor-pointer border border-slate-600" data-color="#000000"></div>
                        <div class="w-5 h-5 rounded-full bg-red-500 cursor-pointer" data-color="#ef4444"></div>
                        <div class="w-5 h-5 rounded-full bg-blue-500 cursor-pointer" data-color="#3b82f6"></div>
                        <div class="w-5 h-5 rounded-full bg-emerald-500 cursor-pointer" data-color="#10b981"></div>
                        <div class="w-5 h-5 rounded-full bg-amber-500 cursor-pointer" data-color="#f59e0b"></div>
                    </div>
                </div>

                <div class="w-6 h-[1px] bg-slate-800"></div>

                <!-- Media Uploads & Embeds -->
                <button id="btn-upload-pdf" class="toolbar-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-800" title="Upload PDF Document">
                    <i class="fas fa-file-pdf text-lg"></i>
                </button>
                <input type="file" id="pdf-file-input" accept=".pdf" class="hidden">

                <button id="btn-open-browser" class="toolbar-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-800" title="Embedded Web Surfer">
                    <i class="fas fa-globe text-lg"></i>
                </button>

                <div class="w-6 h-[1px] bg-slate-800"></div>

                <!-- Undo/Redo & Clear -->
                <button id="btn-undo" class="toolbar-btn w-10 h-10 rounded-xl flex items-center justify-center text-slate-400 hover:bg-slate-800" title="Undo Last Action">
                    <i class="fas fa-undo"></i>
                </button>
                
                <button id="btn-clear" class="toolbar-btn w-10 h-10 rounded-xl flex items-center justify-center text-red-400 hover:bg-red-950/40" title="Clear Canvas">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>

            <!-- WHITEBOARD LAYER CONTAINER -->
            <div id="whiteboard-container">
                <!-- Background Layer for PDF Documents -->
                <canvas id="pdf-canvas"></canvas>
                <!-- Drawing Canvas Layer -->
                <canvas id="drawing-canvas"></canvas>
            </div>

            <!-- EMBEDDED WEB SURFER WINDOW (Draggable & Closable inside workspace) -->
            <div id="browser-window" class="absolute top-20 left-20 w-[500px] h-[400px] bg-slate-900 border border-slate-800 shadow-2xl rounded-xl z-40 hidden flex flex-col overflow-hidden">
                <div class="bg-slate-950 px-4 py-2 flex items-center justify-between text-white cursor-move" id="browser-header">
                    <div class="flex items-center space-x-2">
                        <i class="fas fa-globe text-blue-400 text-xs"></i>
                        <span class="text-xs font-semibold tracking-wide">Web Surfer (Same-Tab Only)</span>
                    </div>
                    <button id="btn-close-browser" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
                </div>
                <!-- Address bar -->
                <div class="bg-slate-900 p-2 border-b border-slate-800 flex space-x-2">
                    <input type="text" id="browser-url" value="https://wikipedia.org" class="flex-1 bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:outline-none">
                    <button id="btn-go-url" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-medium">Go</button>
                </div>
                <!-- Web Frame IFrame View -->
                <div class="flex-1 bg-white">
                    <iframe id="browser-iframe" src="https://wikipedia.org" class="w-full h-full border-none"></iframe>
                </div>
            </div>

        </main>
    </div>

    <!-- MAIN APP SCRIPT LOGIC -->
    <script>
        // State Initialization
        let currentMode = 'pencil'; // pencil, highlighter, laser, eraser
        let currentColor = '#000000';
        let currentLineWidth = 3;
        
        // Multi-slide structure: array of objects containing lines drawing logs
        // and background PDF page configurations
        let slides = [{ drawings: [], pdfPage: null }];
        let currentSlideIdx = 0;
        
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // PDF reference variables
        let currentPdfDoc = null;

        // Media Stream and Recording configuration
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // UI Element Selectors
        const workspace = document.getElementById('whiteboard-workspace');
        const container = document.getElementById('whiteboard-container');
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        const pdfCanvas = document.getElementById('pdf-canvas');
        const pdfCtx = pdfCanvas.getContext('2d');
        
        // Handle canvas sizing properly
        function resizeCanvas() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            
            // Backup standard canvas drawings data before resize reset
            const currentDrawings = slides[currentSlideIdx].drawings;
            
            canvas.width = w;
            canvas.height = h;
            pdfCanvas.width = w;
            pdfCanvas.height = h;
            
            // Redraw everything nicely after resizing window viewport
            redrawSlide();
        }

        window.addEventListener('load', () => {
            resizeCanvas();
            setupDrawingEvents();
            setupPeerJS();
            setupLocalMedia();
        });
        window.addEventListener('resize', resizeCanvas);

        // Sidebar Navigation Tabs Control
        document.getElementById('tab-users').addEventListener('click', () => {
            document.getElementById('tab-users').classList.add('bg-slate-700', 'border-b-2', 'border-blue-500');
            document.getElementById('tab-chat').classList.remove('bg-slate-700', 'border-b-2', 'border-blue-500');
            document.getElementById('panel-users-content').classList.remove('hidden');
            document.getElementById('panel-chat-content').classList.add('hidden');
        });

        document.getElementById('tab-chat').addEventListener('click', () => {
            document.getElementById('tab-chat').classList.add('bg-slate-700', 'border-b-2', 'border-blue-500');
            document.getElementById('tab-users').classList.remove('bg-slate-700', 'border-b-2', 'border-blue-500');
            document.getElementById('panel-chat-content').classList.remove('hidden');
            document.getElementById('panel-users-content').classList.add('hidden');
        });

        // Set Toolbar Tools Listeners
        const toolButtons = {
            'pencil': document.getElementById('tool-pencil'),
            'highlighter': document.getElementById('tool-highlighter'),
            'laser': document.getElementById('tool-laser'),
            'eraser': document.getElementById('tool-eraser')
        };

        Object.keys(toolButtons).forEach(mode => {
            toolButtons[mode].addEventListener('click', () => {
                Object.values(toolButtons).forEach(b => b.classList.remove('active-tool'));
                toolButtons[mode].classList.add('active-tool');
                currentMode = mode;
            });
        });

        // Handle Color Palette Quick Picker selections
        document.querySelectorAll('[data-color]').forEach(item => {
            item.addEventListener('click', (e) => {
                currentColor = e.target.getAttribute('data-color');
                document.getElementById('btn-color-picker').style.backgroundColor = currentColor;
            });
        });

        // Drawing Event Handlers
        function setupDrawingEvents() {
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
        }

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (currentMode === 'laser') {
                showLaserDot(e.clientX - workspace.getBoundingClientRect().left, e.clientY - workspace.getBoundingClientRect().top);
                return;
            }

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);

            // Configure style properties based on active application tool selection
            if (currentMode === 'pencil') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
            } else if (currentMode === 'highlighter') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor + '55'; // add alpha transparency channel
                ctx.lineWidth = 14;
                ctx.lineCap = 'square';
            } else if (currentMode === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 25;
                ctx.lineCap = 'round';
            }

            ctx.stroke();

            // Save line drawings history logs for persistent multi-slide support
            slides[currentSlideIdx].drawings.push({
                x1: lastX, y1: lastY, x2: x, y2: y,
                mode: currentMode, color: currentColor, width: ctx.lineWidth
            });

            lastX = x;
            lastY = y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // Display fading Temporary Laser Pointer Red Dot
        function showLaserDot(x, y) {
            const oldDot = document.querySelector('.laser-pointer');
            if (oldDot) oldDot.remove();

            const dot = document.createElement('div');
            dot.className = 'laser-pointer';
            dot.style.left = `${x - 6}px`;
            dot.style.top = `${y - 6}px`;
            workspace.appendChild(dot);

            setTimeout(() => {
                dot.style.opacity = '0';
                setTimeout(() => dot.remove(), 1000);
            }, 200);
        }

        // Core Redraw whiteboards canvas logic layer
        function redrawSlide() {
            // Reset layers
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pdfCtx.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);

            const activeSlide = slides[currentSlideIdx];

            // Update UI Counters text
            document.getElementById('slide-info').innerText = `Slide ${currentSlideIdx + 1} / ${slides.length}`;

            // Check if slide contains rendered PDF background to paint
            if (activeSlide.pdfPage && currentPdfDoc) {
                currentPdfDoc.getPage(activeSlide.pdfPage).then(page => {
                    const viewport = page.getViewport({ scale: 1 });
                    const scaleX = pdfCanvas.width / viewport.width;
                    const scaleY = pdfCanvas.height / viewport.height;
                    const optimalScale = Math.min(scaleX, scaleY) * 0.95;
                    
                    const scaledViewport = page.getViewport({ scale: optimalScale });
                    
                    // Center PDF inside canvas boundaries seamlessly without jitter
                    const offsetX = (pdfCanvas.width - scaledViewport.width) / 2;
                    const offsetY = (pdfCanvas.height - scaledViewport.height) / 2;

                    page.render({
                        canvasContext: pdfCtx,
                        viewport: scaledViewport,
                        transform: [1, 0, 0, 1, offsetX, offsetY]
                    });
                });
            }

            // Redraw historic ink drawing lines paths sequentially onto the main canvas view layer
            activeSlide.drawings.forEach(d => {
                ctx.beginPath();
                ctx.moveTo(d.x1, d.x2 ? d.x1 : d.x1); // absolute coordinates mapping
                ctx.beginPath();
                ctx.moveTo(d.x1, d.y1);
                ctx.lineTo(d.x2, d.y2);

                if (d.mode === 'pencil') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = d.color;
                    ctx.lineWidth = d.width;
                    ctx.lineCap = 'round';
                } else if (d.mode === 'highlighter') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = d.color + '55';
                    ctx.lineWidth = d.width;
                    ctx.lineCap = 'square';
                } else if (d.mode === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = d.width;
                    ctx.lineCap = 'round';
                }
                ctx.stroke();
            });
            ctx.globalCompositeOperation = 'source-over'; // restore standard layer default modes
        }

        // Multi-Slide Navigation Events
        document.getElementById('btn-add-slide').addEventListener('click', () => {
            slides.push({ drawings: [], pdfPage: null });
            currentSlideIdx = slides.length - 1;
            redrawSlide();
        });

        document.getElementById('btn-prev-slide').addEventListener('click', () => {
            if (currentSlideIdx > 0) {
                currentSlideIdx--;
                redrawSlide();
            }
        });

        document.getElementById('btn-next-slide').addEventListener('click', () => {
            if (currentSlideIdx < slides.length - 1) {
                currentSlideIdx++;
            } else {
                slides.push({ drawings: [], pdfPage: null });
                currentSlideIdx = slides.length - 1;
            }
            redrawSlide();
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            if(confirm("Clear current drawing canvas paths?")) {
                slides[currentSlideIdx].drawings = [];
                redrawSlide();
            }
        });

        // Upload PDF Document without breaking slides or jittering
        const pdfFileInput = document.getElementById('pdf-file-input');
        document.getElementById('btn-upload-pdf').addEventListener('click', () => pdfFileInput.click());

        pdfFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                const typedarray = new Uint8Array(ev.target.result);
                
                // Initialize PDFJS library engine cleanly
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    currentPdfDoc = pdf;
                    
                    // Map out pages sequentially without deleting current work
                    // Automatically append/fill slides based on PDF document counts mapping
                    for(let i = 1; i <= pdf.numPages; i++) {
                        if (i === 1) {
                            slides[currentSlideIdx].pdfPage = 1;
                        } else {
                            slides.push({ drawings: [], pdfPage: i });
                        }
                    }
                    redrawSlide();
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // Safe Non-Jittery Embedded Web Surfer IFrame (Same-Tab Only Mode)
        const browserWindow = document.getElementById('browser-window');
        document.getElementById('btn-open-browser').addEventListener('click', () => {
            browserWindow.classList.toggle('hidden');
        });
        document.getElementById('btn-close-browser').addEventListener('click', () => {
            browserWindow.classList.add('hidden');
        });

        document.getElementById('btn-go-url').addEventListener('click', () => {
            let url = document.getElementById('browser-url').value;
            if(!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            document.getElementById('browser-iframe').src = url;
        });

        // Simple Dragging functionality for Web Surfer Toolbar Element
        const browserHeader = document.getElementById('browser-header');
        let isDraggingBrowser = false, bX = 0, bY = 0;
        browserHeader.addEventListener('mousedown', (e) => {
            isDraggingBrowser = true;
            bX = e.clientX - browserWindow.offsetLeft;
            bY = e.clientY - browserWindow.offsetTop;
        });
        window.addEventListener('mousemove', (e) => {
            if(isDraggingBrowser) {
                browserWindow.style.left = `${e.clientX - bX}px`;
                browserWindow.style.top = `${e.clientY - bY}px`;
            }
        });
        window.addEventListener('mouseup', () => isDraggingBrowser = false);

        // Session Media Recorder Logic
        const btnRecord = document.getElementById('btn-record');
        btnRecord.addEventListener('click', () => {
            if(!isRecording) {
                startSessionRecording();
            } else {
                stopSessionRecording();
            }
        });

        async function startSessionRecording() {
            try {
                recordedChunks = [];
                const canvasStream = canvas.captureStream(30); // 30 FPS screen tracking capture
                
                let audioStream;
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    // Combine video capture track with voice audio streams nicely
                    const combined = new MediaStream([...canvasStream.getVideoTracks(), ...audioStream.getAudioTracks()]);
                    mediaRecorder = new MediaRecorder(combined, { mimeType: 'video/webm' });
                } catch(err) {
                    console.warn("Microphone access denied or unavailable, recording canvas stream alone.");
                    mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
                }

                mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = saveRecordedSessionFile;

                mediaRecorder.start();
                isRecording = true;
                document.getElementById('record-text').innerText = "Stop Record";
                btnRecord.classList.replace('bg-red-600', 'bg-slate-700');
            } catch(error) {
                alert("Could not start Session Recording tool: " + error.message);
            }
        }

        function stopSessionRecording() {
            if(mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('record-text').innerText = "Start Record";
                btnRecord.classList.replace('bg-slate-700', 'bg-red-600');
            }
        }

        function saveRecordedSessionFile() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tutorMohan-Session-${Date.now()}.webm`;
            a.click();
        }

        // Save Board markup drawings safely into a single multi-page PDF document
        document.getElementById('btn-save-board').addEventListener('click', async () => {
            const { jsPDF } = window.jspdf;
            const pdfDoc = new jsPDF('l', 'px', [canvas.width, canvas.height]);

            for (let i = 0; i < slides.length; i++) {
                if(i > 0) pdfDoc.addPage([canvas.width, canvas.height], 'l');
                
                // Switch slide index sequentially to capture image states
                currentSlideIdx = i;
                redrawSlide();
                
                // Allow small delay frame rendering before canvas capture export snaps
                await new Promise(r => setTimeout(r, 100));

                // Combine layers to output single screenshot canvas
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = canvas.width;
                exportCanvas.height = canvas.height;
                const exportCtx = exportCanvas.getContext('2d');

                // Paint PDF layer then drawings onto export canvas layer
                exportCtx.drawImage(pdfCanvas, 0, 0);
                exportCtx.drawImage(canvas, 0, 0);

                const imgData = exportCanvas.toDataURL('image/png');
                pdfDoc.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
            }
            
            pdfDoc.save(`tutorMohan-ClassBoardNotes-${Date.now()}.pdf`);
            alert("Board notes saved successfully!");
        });

        // Chat Text Processing Engine
        const chatInput = document.getElementById('chat-input');
        const btnSendChat = document.getElementById('btn-send-chat');
        const chatMessages = document.getElementById('chat-messages');

        function appendChatMessage(sender, text, isMe = true) {
            const msgNode = document.createElement('div');
            msgNode.className = `p-2 rounded max-w-[85%] ${isMe ? 'bg-blue-600 ml-auto text-white' : 'bg-slate-700 text-slate-100'}`;
            msgNode.innerHTML = `<span class="block text-[10px] font-semibold text-slate-300">${sender}</span><span class="text-xs">${text}</span>`;
            chatMessages.appendChild(msgNode);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        btnSendChat.addEventListener('click', () => {
            const txt = chatInput.value.trim();
            if(!txt) return;
            appendChatMessage("You (Teacher)", txt, true);
            chatInput.value = '';
        });
        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') btnSendChat.click(); });

        // Setup PeerJS for high performance production classroom WebRTC networking
        function setupPeerJS() {
            const randomRoomId = Math.random().toString(36).substring(2, 7);
            document.getElementById('room-display').innerText = `Room ID: ${randomRoomId}`;
        }

        // Setup Audio/Video Camera Streams handles
        async function setupLocalMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('local-video').srcObject = stream;
            } catch(e) {
                console.warn("Camera or microphone hardware missing or denied context.", e);
            }
        }
    </script>
</body>
</html>
