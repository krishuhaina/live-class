<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor Mohan - Fixed VC</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{margin:0;background:#020617;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column}
.top{height:60px;background:#0f172a;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{width:38px;height:38px;background:#22c55e;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.main{flex:1;display:flex;overflow:hidden}.left{flex:1;display:flex;flex-direction:column}
#board{flex:1;background:#fff;touch-action:none}
.toolbar{height:50px;background:#0f172a;display:flex;gap:8px;align-items:center;padding:0 12px}
.right{width:360px;background:#0f172a;border-left:1px solid #1e293b;display:flex;flex-direction:column;padding:10px;gap:8px}
#vcBox{height:240px;background:#000;border:2px solid #22c55e;border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;background:#111;border-radius:8px}
.btn{padding:8px 12px;border-radius:8px;border:0;font-weight:700;cursor:pointer}.ok{background:#22c55e;color:#000}.off{background:#ef4444;color:#fff}.dark{background:#1e293b;color:#fff}
#status{font-size:11px;padding:6px;background:#020617;border-radius:6px;color:#22c55e}
</style></head><body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><div class="logo">M</div><div style="font-weight:800">Tutor Mohan</div><div id="roomLabel" style="background:#1e293b;padding:4px 10px;border-radius:20px;font-size:12px"></div></div><button id="clsBtn" class="btn ok" onclick="togCls()"><span id="clsTx">Start Class</span></button></div>
<div class="main"><div class="left"><canvas id="board"></canvas><div class="toolbar"><button class="btn dark" onclick="tool='pen'">Pen</button><button class="btn dark" onclick="tool='eraser'">Eraser</button><input type="color" id="col" value="#000000"><button class="btn dark" onclick="clearBoard()">Clear</button></div></div>
<div class="right"><div id="status">⚫ OFF - Teacher must START first</div><div id="vcBox"><div style="display:flex;align-items:center;justify-content:center;color:#666;grid-column:1/-1;font-size:12px;text-align:center">Click Start Class<br>Allow Camera</div></div><div style="display:flex;gap:6px"><button class="btn dark" style="flex:1" onclick="togMic()">Mic</button><button class="btn dark" style="flex:1" onclick="togCam()">Cam</button><button class="btn dark" style="flex:1" onclick="retryConnect()">Reconnect</button></div><div id="log" style="height:100px;background:#020617;border:1px solid #1e293b;border-radius:8px;padding:6px;overflow:auto;font-size:11px"></div></div></div>
<script>
let room=new URLSearchParams(location.search).get('room')||'mohan-class-1'; let role=new URLSearchParams(location.search).get('role')||'teacher';
document.getElementById('roomLabel').textContent='Room: '+room+' | '+role;
let canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.parentElement.clientWidth; canvas.height=canvas.parentElement.clientHeight-50; ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);} resize(); window.addEventListener('resize',resize);
let tool='pen',drawing=false,lx=0,ly=0; function clearBoard(){ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);}
canvas.addEventListener('pointerdown',e=>{drawing=true; let r=canvas.getBoundingClientRect(); lx=e.clientX-r.left; ly=e.clientY-r.top;});
canvas.addEventListener('pointermove',e=>{if(!drawing)return; let r=canvas.getBoundingClientRect(); let x=e.clientX-r.left,y=e.clientY-r.top; ctx.strokeStyle=document.getElementById('col').value; ctx.lineWidth=3; ctx.lineCap='round'; ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over'; ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke(); lx=x; ly=y;});
canvas.addEventListener('pointerup',()=>drawing=false);
function addLog(t){let l=document.getElementById('log'); let d=document.createElement('div'); d.textContent=new Date().toLocaleTimeString()+': '+t; l.appendChild(d); l.scrollTop=9999;}
let myPeer=null,myStream=null,teacherConn=null;
function addV(id,stream){let box=document.getElementById('vcBox'); if(document.getElementById('v-'+id))return; let v=document.createElement('video'); v.id='v-'+id; v.srcObject=stream; v.autoplay=true; v.playsInline=true; if(id==='me')v.muted=true; v.play(); box.appendChild(v); addLog('Video added: '+id);}
async function initVC(){
 let box=document.getElementById('vcBox'); box.innerHTML=''; 
 try{myStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});}catch(err){alert('Allow Camera Mic! '+err);return;}
 addV('me',myStream);
 if(role==='teacher'){
   let teacherId='tutor-mohan-'+room; addLog('Teacher ID: '+teacherId);
   myPeer=new Peer(teacherId); // FIXED ID for teacher
   myPeer.on('open',id=>{addLog('Teacher LIVE: '+id); document.getElementById('status').textContent='🟢 LIVE - Waiting for students...';});
   myPeer.on('call',call=>{addLog('Student calling...'); call.answer(myStream); call.on('stream',s=>addV(call.peer,s));});
   myPeer.on('error',e=>addLog('Error: '+e));
 } else {
   // STUDENT
   let myId='student-'+Math.floor(Math.random()*99999); myPeer=new Peer(myId);
   myPeer.on('open',()=>{addLog('Student ready, calling teacher...'); setTimeout(()=>callTeacher(),1000);});
 }
}
function callTeacher(){
 let teacherId='tutor-mohan-'+room; addLog('Calling '+teacherId+'...'); let call=myPeer.call(teacherId,myStream);
 if(!call){addLog('Teacher not online! Ask teacher to START FIRST. Retrying in 3s...'); setTimeout(callTeacher,3000); return;}
 call.on('stream',s=>{addLog('Connected to Teacher!'); addV('teacher',s); document.getElementById('status').textContent='🟢 CONNECTED to Teacher';});
 call.on('error',e=>{addLog('Call failed, retrying...'); setTimeout(callTeacher,3000);});
 call.on('close',()=>addLog('Call closed'));
}
function retryConnect(){if(role!=='teacher')callTeacher();}
async function togCls(){
 let b=document.getElementById('clsBtn'),t=document.getElementById('clsTx');
 if(b.classList.contains('ok')){b.classList.remove('ok');b.classList.add('off');t.textContent='End Class'; await initVC();}
 else{b.classList.remove('off');b.classList.add('ok');t.textContent='Start Class'; if(myStream)myStream.getTracks().forEach(x=>x.stop()); if(myPeer)myPeer.destroy(); document.getElementById('vcBox').innerHTML='OFF'; document.getElementById('status').textContent='⚫ OFF';}
}
function togMic(){if(myStream)myStream.getAudioTracks().forEach(a=>a.enabled=!a.enabled); addLog('Mic toggled');}
function togCam(){if(myStream)myStream.getVideoTracks().forEach(a=>a.enabled=!a.enabled); addLog('Cam toggled');}
</script></body></html>
